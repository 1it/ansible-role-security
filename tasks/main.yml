---
- name: Preflight | Validate platform and load OS variables
  ansible.builtin.import_tasks: preflight.yml
  tags:
    - always

- name: Sysctl | Configure kernel and network hardening
  ansible.builtin.import_tasks: sysctl.yml
  when: security_sysctl_enabled | bool
  tags:
    - sysctl

- name: SSH | Configure OpenSSH server hardening
  ansible.builtin.import_tasks: ssh.yml
  when: security_ssh_enabled | bool
  tags:
    - ssh

- name: PAM | Configure password quality and su restrictions
  ansible.builtin.import_tasks: pam.yml
  when: security_pam_enabled | bool
  tags:
    - pam

- name: Auto Updates | Configure unattended security updates
  ansible.builtin.import_tasks: auto_updates.yml
  when: security_auto_updates_enabled | bool
  tags:
    - auto_updates
    - updates

- name: Knockd | Configure port-knocking daemon
  ansible.builtin.import_tasks: knockd.yml
  when: security_knockd_enabled | bool
  tags:
    - knockd

- name: System | Harden accounts, root directories, and limits
  ansible.builtin.import_tasks: system.yml
  tags:
    - system
